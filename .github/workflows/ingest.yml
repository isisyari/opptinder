# Nightly refresh of the hosted database. Runs the scrapers here (free GitHub minutes) and writes
# straight to Postgres, so neither your laptop nor the web server is involved.
#
# Repo → Settings → Secrets and variables → Actions → New repository secret:
#   DATABASE_URL        the same Neon connection string Vercel uses
#   KAGGLE_API_TOKEN    optional; without it the Kaggle source is skipped
#   PATHWAYS_OK         optional; set to 1 only after Pathways to Science says yes
#   ANTHROPIC_API_KEY   optional; set it AND change ENRICH below to "1" to read new pages with Claude (paid)
name: nightly ingest

on:
  schedule:
    - cron: "17 9 * * *"        # 09:17 UTC daily (~04:17 US Eastern); odd minute avoids the top-of-hour rush
  workflow_dispatch: {}         # "Run workflow" button for manual refreshes

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          PATHWAYS_OK: ${{ secrets.PATHWAYS_OK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENRICH: "0"
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is not set"; exit 1; }
          python ingest.py
